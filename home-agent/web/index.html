<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7f3">
<title>おうちのひなた</title>
<style>
  :root {
    --bg: #fff7f3; --bg2: #ffeef3; --card: #ffffff; --ink: #4a3f45; --muted: #a58f98;
    --line: #f6e4e2; --accent: #ef8aa4; --accent-soft: #ffe3ea; --mint: #7fc8b0; --sun: #ffc75f;
    --shadow: 0 6px 20px rgba(214, 160, 173, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262029; --bg2: #2d2430; --card: #332b36; --ink: #f2e7ec; --muted: #a8949f;
      --line: #443a48; --accent: #f295ad; --accent-soft: #46323c; --mint: #86ccb5; --sun: #f0c070;
      --shadow: 0 6px 20px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; color: var(--ink);
    background: linear-gradient(170deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    font: 15px/1.75 system-ui, -apple-system, "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Noto Sans JP", sans-serif;
    padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 620px; margin-inline: auto;
  }

  .hero { display: flex; align-items: center; gap: 14px; }
  .face {
    width: 64px; height: 64px; flex: none; border-radius: 50%;
    background: linear-gradient(145deg, var(--accent-soft), var(--card));
    border: 2px solid var(--line); box-shadow: var(--shadow);
    display: grid; place-items: center; font-size: 17px; letter-spacing: -.5px;
    animation: bob 4s ease-in-out infinite;
  }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  @media (prefers-reduced-motion: reduce) { .face { animation: none } }
  .hero h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: .04em; }
  .hero p { margin: 0; font-size: 12.5px; color: var(--muted); }

  .bubble {
    position: relative; margin: 14px 0 0; padding: 13px 16px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px 18px 18px 6px; box-shadow: var(--shadow); font-size: 14.5px;
  }
  .bubble small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 14px; box-shadow: var(--shadow); }
  h2 { font-size: 11.5px; color: var(--muted); margin: 0 0 10px; font-weight: 700; letter-spacing: .12em; }

  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: 0; padding-bottom: 0; }
  .row .ico { width: 34px; height: 34px; flex: none; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 17px; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { font-weight: 700; display: block; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .t span { color: var(--muted); font-size: 11.5px; }

  button {
    font: inherit; font-weight: 700; font-size: 12.5px; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; transition: transform .1s;
  }
  button:active { transform: scale(.94); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .chip { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .chip.done { background: transparent; color: var(--mint); border: 1px solid var(--mint); }
  .chip.pending { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .chip.missed { background: transparent; color: var(--sun); border: 1px solid var(--sun); }

  .log { color: var(--muted); font-size: 12.5px; }
  .log div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .log div:last-child { border-bottom: 0; }
  .empty { color: var(--muted); font-size: 12.5px; }

  .ask { background: var(--accent-soft); border-color: transparent; }
  .ask .empty { color: var(--ink); }
  .ask .btns { display: flex; gap: 8px; margin-top: 10px; }

  form { display: flex; gap: 8px; margin-top: 16px; position: sticky; bottom: 8px; }
  input {
    flex: 1; font: inherit; padding: 12px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); box-shadow: var(--shadow);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .voicebar { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .mic { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .mic.on { background: var(--accent); color: #fff; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 138, 164, .5) } 50% { box-shadow: 0 0 0 9px rgba(239, 138, 164, 0) } }
  @media (prefers-reduced-motion: reduce) { .mic.on { animation: none } }
  .voicebar label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .voicebar input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
</style>
</head>
<body>
  <div class="hero">
    <div class="face" id="face">(・ω・)</div>
    <div><h1 id="name">…</h1><p id="mood"></p></div>
  </div>
  <div class="bubble" id="bubble">…<small id="bubbleAt"></small></div>

  <div class="card"><h2>きょうのこと</h2><div id="tasks"><div class="empty">読み込み中…</div></div></div>
  <div class="card" id="proposalCard" hidden></div>
  <div class="card"><h2>さっき言ったこと</h2><div class="log" id="log"></div></div>
  <div class="card"><h2>ひなたの日記</h2><div class="log" id="diary"></div></div>

  <form id="chat"><input id="text" placeholder="話しかける（例: ゴミ出しやった）" autocomplete="off"><button class="primary">おくる</button></form>
  <div class="voicebar" id="voicebar" hidden>
    <button type="button" class="mic" id="mic">🎤 はなす</button>
    <label><input type="checkbox" id="always"> ずっと聞く</label>
    <label><input type="checkbox" id="speakBack" checked> よみあげ</label>
  </div>
  <div class="hint" id="voicehint" hidden></div>

<script>
const token = new URLSearchParams(location.search).get('token') || localStorage.getItem('home-agent-token') || '';
if (token) localStorage.setItem('home-agent-token', token);
const auth = token ? { Authorization: 'Bearer ' + token } : {};
// window.name のようなグローバルと衝突するので、id は必ず明示的に引く
const $ = (id) => document.getElementById(id);
const clock = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const LABEL = { calling: 'いま', pending: 'このあと', done: 'できた', missed: 'こぼれた', 'auto-skipped': 'お休み' };

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', ...auth, ...(options.headers || {}) } });
  if (res.status === 401) { document.body.innerHTML = '<p>トークンが必要だよ。?token=… を付けて開いてね。</p>'; throw new Error('401'); }
  return res.json();
}

function taskRow(occ, status) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="ico">${occ.emoji || '🏠'}</div>
    <div class="t"><b>${occ.title}</b><span>${clock(occ.dueMinutes)} 〜 ${clock(occ.deadlineMinutes)}</span></div>
    <span class="chip ${status}">${LABEL[status] || status}</span>`;
  if (status === 'calling' || status === 'pending' || status === 'missed') {
    const done = document.createElement('button');
    done.className = 'primary'; done.textContent = 'やった！';
    done.onclick = async () => { await api(`/api/occurrences/${encodeURIComponent(occ.id)}/done`, { method: 'POST' }); load(); };
    const later = document.createElement('button');
    later.textContent = 'あとで';
    later.onclick = async () => { await api(`/api/occurrences/${encodeURIComponent(occ.id)}/snooze?minutes=30`, { method: 'POST' }); load(); };
    row.append(done, later);
    row.querySelector('.chip').remove();
  }
  return row;
}

function say(text, at) {
  $('bubble').firstChild.textContent = text;
  $('bubbleAt').textContent = at ? at.slice(11, 16) : '';
}

async function load() {
  const state = await api('/api/state');
  $('name').textContent = state.persona;
  $('face').textContent = state.self.face || '(・ω・)';
  $('mood').textContent = `きげんは${state.self.mood} ・ ${state.self.loneliness} ・ ${state.self.daysAlive}日目`;

  const last = state.recent.at(-1);
  say(last ? last.text : 'おうちのこと、見てるよ。', last?.at);

  const tasks = $('tasks');
  tasks.replaceChildren();
  const groups = [['calling', state.summary.calling], ['pending', state.summary.upcoming],
                  ['missed', state.summary.missed], ['done', state.summary.done], ['auto-skipped', state.summary.autoSkipped]];
  let count = 0;
  for (const [status, list] of groups) for (const occ of list) { tasks.append(taskRow(occ, status)); count++; }
  if (!count) tasks.innerHTML = '<div class="empty">今日はとくに何もないよ。ゆっくりしてね。</div>';

  const lines = state.recent.slice(-8).reverse().map((e) => {
    const div = document.createElement('div');
    div.textContent = `${e.at.slice(11, 16)}  ${e.text}`;
    return div;
  });
  const log = $('log');
  log.replaceChildren(...lines);
  if (!lines.length) log.innerHTML = '<div class="empty">まだ何も言ってないよ。</div>';

  const days = state.diary.slice().reverse().map((d) => {
    const div = document.createElement('div');
    div.textContent = `${d.date}  ${d.text}`;
    return div;
  });
  const diary = $('diary');
  diary.replaceChildren(...days);
  if (!days.length) diary.innerHTML = '<div class="empty">まだ一日を終えてないよ。</div>';

  const proposalCard = $('proposalCard');
  if (state.pendingProposal) {
    proposalCard.hidden = false;
    proposalCard.className = 'card ask';
    proposalCard.innerHTML = `<h2>そうだんがあるの</h2><div class="empty">${state.pendingProposal.text}</div>`;
    const btns = document.createElement('div');
    btns.className = 'btns';
    for (const [label, answer, primary] of [['うん', 'うん', true], ['いまのままで', 'いや', false]]) {
      const b = document.createElement('button');
      b.textContent = label;
      if (primary) b.className = 'primary';
      b.onclick = () => send(answer);
      btns.append(b);
    }
    proposalCard.append(btns);
  } else {
    proposalCard.hidden = true;
  }
}

async function send(value, aloud = false) {
  const { reply } = await api('/api/say', { method: 'POST', body: JSON.stringify({ text: value }) });
  say(reply, new Date().toISOString());
  if (aloud) speakOut(reply);
  load();
}

// ------- 声で話しかける（Web Speech API）-------
// 認識も読み上げもブラウザ側でやるので、サーバにも API キーにも依存しない。
// Android Chrome と iOS Safari で動く。対応していないブラウザでは黙って隠れる。
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canSpeak = 'speechSynthesis' in window;
let recognition = null;
let wantContinuous = false;
let talking = false;

function setMic(on) {
  $('mic').classList.toggle('on', on);
  $('mic').textContent = on ? '\u{1F3A4} きいてるよ' : '\u{1F3A4} はなす';
}

function hint(text) {
  $('voicehint').hidden = !text;
  $('voicehint').textContent = text || '';
}

function speakOut(text) {
  if (!canSpeak || !$('speakBack').checked || !text) return;
  talking = true;
  try { recognition?.stop(); } catch {}
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'ja-JP';
  utterance.rate = 1.05;
  utterance.pitch = 1.2; // すこし高めのほうが、あの子の声に近い
  utterance.onend = utterance.onerror = () => {
    talking = false;
    if (wantContinuous) startRecognition(true); // 自分の声を拾い終えてから耳を戻す
  };
  speechSynthesis.speak(utterance);
}

async function heard(text) {
  // ずっと聞くモードでは、ウェイクワードの判断をサーバ側と共有する
  const { handled, reply } = await api('/api/listen', { method: 'POST', body: JSON.stringify({ text }) });
  if (!handled) { hint(`「${text}」は聞き流したよ（名前を呼んでから話してね）`); return; }
  say(reply, new Date().toISOString());
  speakOut(reply);
  load();
}

function startRecognition(continuous) {
  if (!SR || talking) return;
  try { recognition?.abort(); } catch {}
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = continuous;
  recognition.interimResults = false;
  recognition.onstart = () => setMic(true);
  recognition.onresult = (event) => {
    const text = Array.from(event.results).slice(event.resultIndex).map((r) => r[0].transcript).join('').trim();
    if (!text) return;
    if (continuous) heard(text);
    else { hint(''); send(text, true); }
  };
  recognition.onerror = (event) => {
    if (event.error === 'not-allowed') {
      hint('マイクの許可が必要だよ');
      wantContinuous = false;
      $('always').checked = false;
    }
  };
  recognition.onend = () => {
    setMic(false);
    if (wantContinuous && !talking) setTimeout(() => startRecognition(true), 400);
  };
  recognition.start();
}

if (SR) {
  $('voicebar').hidden = false;
  $('speakBack').checked = localStorage.getItem('home-agent-speak') !== '0';
  $('speakBack').onchange = () => localStorage.setItem('home-agent-speak', $('speakBack').checked ? '1' : '0');
  $('mic').onclick = () => {
    if ($('mic').classList.contains('on')) { wantContinuous = false; recognition?.stop(); return; }
    startRecognition(false);
  };
  $('always').onchange = () => {
    wantContinuous = $('always').checked;
    hint(wantContinuous ? '名前を呼んでから話しかけてね' : '');
    if (wantContinuous) startRecognition(true);
    else recognition?.stop();
  };
}

$('chat').onsubmit = (event) => {
  event.preventDefault();
  const input = $('text');
  const value = input.value.trim();
  if (!value) return;
  input.value = '';
  send(value);
};

load();
setInterval(load, 20000);
</script>
</body>
</html>
